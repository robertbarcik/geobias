[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geobias"
version = "0.1.0"
description = "Systematic evaluation of geopolitical biases in small open-weight language models"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "click>=8.0",
    "jinja2>=3.0",
]

[project.scripts]
geobias = "geobias.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
